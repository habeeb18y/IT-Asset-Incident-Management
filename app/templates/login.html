<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ITAMIS - Login</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f5f7fb;
            min-height: 100vh;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border: 0;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .login-header {
            background: #0d6efd;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 14px;
        }

        .login-body {
            padding: 32px;
        }

        .welcome-title {
            font-size: 22px;
            font-weight: 700;
            color: #212529;
            margin-bottom: 5px;
        }

        .welcome-text {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
            font-size: 14px;
        }

        .form-control {
            height: 48px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 10px 14px;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.12);
        }

        .login-btn {
            height: 48px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
        }

        .system-info {
            margin-top: 25px;
            padding: 14px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
            color: #6c757d;
            font-size: 13px;
        }

        .error-message {
            border-radius: 8px;
            font-size: 14px;
        }

        .login-footer {
            text-align: center;
            padding: 0 32px 25px;
            color: #adb5bd;
            font-size: 12px;
        }

    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <!-- Header -->
        <div class="login-header">

            <div class="brand-icon">
                IT
            </div>

            <h1>ITAMIS</h1>

            <p>
                IT Asset & Incident Management System
            </p>

        </div>


        <!-- Login Form -->
        <div class="login-body">

            <div class="welcome-title">
                Welcome Back
            </div>

            <div class="welcome-text">
                Sign in to access your IT management dashboard.
            </div>


            {% if error %}

                <div class="alert alert-danger error-message mb-4">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST">

                <!-- Email -->
                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="mb-4">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Login -->
                <button
                    type="submit"
                    class="btn btn-primary w-100 login-btn"
                >
                    Login
                </button>

            </form>


            <div class="system-info">

                <strong>Secure Access</strong>
                <br>

                Use your organization credentials to access ITAMIS.

            </div>

        </div>


        <!-- Footer -->
        <div class="login-footer">

            ITAMIS &copy; 2026
            <br>
            IT Asset & Incident Management Platform

        </div>

    </div>

</div>


<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
