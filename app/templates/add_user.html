{% extends "base.html" %}

{% block title %}Create User - ITAMIS{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7 col-xl-6">

        <div class="mb-4">
            <h2 class="fw-bold mb-1">Create New User</h2>
            <p class="text-muted mb-0">
                Add a new user to the ITAMIS platform.
            </p>
        </div>


        <div class="card shadow-sm border-0">

            <div class="card-header bg-white">
                <h5 class="mb-0">User Information</h5>
            </div>

            <div class="card-body p-4">

                {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}


                <form method="POST">

                    <!-- NAME -->
                    <div class="mb-3">

                        <label for="name"
                               class="form-label fw-semibold">
                            Full Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            name="name"
                            placeholder="Enter full name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->
                    <div class="mb-3">

                        <label for="email"
                               class="form-label fw-semibold">
                            Email Address
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter email address"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="mb-3">

                        <label for="password"
                               class="form-label fw-semibold">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            required
                        >

                        <div class="form-text">
                            The password will be securely stored as a
                            password hash.
                        </div>

                    </div>


                    <!-- ROLE -->
                    <div class="mb-4">

                        <label for="role"
                               class="form-label fw-semibold">
                            User Role
                        </label>

                        <select
                            class="form-select"
                            id="role"
                            name="role"
                            required
                        >

                            <option value="EMPLOYEE">
                                Employee
                            </option>

                            <option value="TECHNICIAN">
                                Technician
                            </option>

                            <option value="ADMIN">
                                Administrator
                            </option>

                        </select>

                    </div>


                    <!-- ACTIONS -->
                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Create User
                        </button>

                        <a
                            href="{{ url_for('main.users') }}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
